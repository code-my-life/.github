name: Tests

# Les tests du contrôle des conventions (conventions/check.py), à chaque push sur main et sur chaque pull request.
# Bibliothèque standard seulement, comme le contrôle : le Python du runner suffit.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests du contrôle des conventions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests
        run: python3 -m unittest discover -s tests -v
