# Généré par hermes-software-factory (scripts/factory-github-templates.py) depuis config/types.yaml : ne pas éditer ici.
name: Bug
description: Un écart avec un comportement ou un rendu déjà défini (spécification, standard, version précédente).
labels:
- type:bug
type: Bug
body:
- type: markdown
  attributes:
    value: 'Modèle de la software factory (ADR 0017). Chaque section obligatoire est vérifiée à l''entrée : une issue incomplète
      reçoit le label « à cadrer » et ne part pas en fabrication. Numérote les critères C1, C2… : chacun se vérifie par un
      test, une mesure ou une capture.'
- type: textarea
  id: constat
  attributes:
    label: Constat
    description: Ce qui se passe aujourd'hui, ce qui manque ou gêne. Des faits, pas la solution.
  validations:
    required: true
- type: textarea
  id: impact
  attributes:
    label: Impact
    description: Pour qui, et ce que cela coûte ou empêche.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Reproduction
    description: Les étapes, l'appareil, le thème, la version. Une capture si c'est visible.
  validations:
    required: true
- type: textarea
  id: reference
  attributes:
    label: Référence
    description: 'Ce qui définit le bon comportement : spécification, standard de l''app, version précédente, documentation.
      Sans référence existante, ce n''est pas un bug : c''est une issue Interface ou Fonctionnalité.'
  validations:
    required: true
- type: textarea
  id: cause
  attributes:
    label: Cause
    description: Si elle est connue, le fichier et la ligne.
  validations:
    required: false
- type: textarea
  id: attendu
  attributes:
    label: Attendu
    description: Le résultat voulu, déjà décidé. Pas une piste à explorer.
  validations:
    required: true
- type: textarea
  id: criteres
  attributes:
    label: Critères d'acceptation
    description: 'Une ligne par critère, numérotée C1, C2… Chaque critère se vérifie par un test, une mesure ou une capture
      : « lisible » devient « un caractère au moins et les points de suspension visibles », « sur une ligne » devient « 20
      px de haut ».'
    placeholder: |-
      - C1 : …
      - C2 : …
  validations:
    required: true
- type: textarea
  id: tests
  attributes:
    label: Tests
    description: 'Une ligne par test : le fichier entre accents graves et le nom exact du test entre « ». Le premier échoue
      avant la correction et passe après.'
    placeholder: '- `chemin/du/fichier.test.ts` : « nom exact du test »'
  validations:
    required: true
- type: textarea
  id: ne_change_pas
  attributes:
    label: Ne change pas
    description: Ce qui doit rester tel quel, hors du périmètre.
  validations:
    required: false
