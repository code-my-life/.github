# Généré par hermes-software-factory (scripts/factory-github-templates.py) depuis config/types.yaml : ne pas éditer ici.
name: Skill
description: Le texte d'une skill de code-my-life/skills, changé ou nouveau, à partir d'un blocage ou d'un besoin constaté.
labels:
- type:skill
type: Task
body:
- type: markdown
  attributes:
    value: 'Modèle de la software factory (ADR 0017). Chaque section obligatoire est vérifiée à l''entrée : une issue incomplète
      reçoit le label « à cadrer » et ne part pas en fabrication. Numérote les critères C1, C2… : chacun se vérifie par un
      test, une mesure ou une capture.'
- type: textarea
  id: skill
  attributes:
    label: Skill et fichier
    description: 'La skill de code-my-life/skills et le fichier touché, entre accents graves : `skills/<nom>/SKILL.md`. Pour
      une skill nouvelle, le fichier qu''elle aura.'
    placeholder: '`skills/<nom>/SKILL.md`'
  validations:
    required: true
- type: textarea
  id: origine
  attributes:
    label: Texte d'origine
    description: Le passage exact du fichier sur main, copié tel quel. « aucun » pour une skill nouvelle.
    render: markdown
  validations:
    required: true
- type: textarea
  id: propose
  attributes:
    label: Texte proposé
    description: Le passage qui le remplace.
    render: markdown
  validations:
    required: true
- type: textarea
  id: raison
  attributes:
    label: Raison
    description: Pourquoi ce changement, en une ou deux phrases.
  validations:
    required: true
- type: textarea
  id: preuve
  attributes:
    label: Preuve
    description: La carte, la séance ou le verdict qui montre le blocage ou le besoin.
  validations:
    required: true
- type: textarea
  id: criteres
  attributes:
    label: Critères d'acceptation
    description: 'Une ligne par critère, numérotée C1, C2… Chaque critère se vérifie par un test, une mesure ou une capture
      : « lisible » devient « un caractère au moins et les points de suspension visibles », « sur une ligne » devient « 20
      px de haut ».'
    placeholder: |-
      - C1 : …
      - C2 : …
  validations:
    required: true
- type: textarea
  id: ne_change_pas
  attributes:
    label: Ne change pas
    description: Ce qui doit rester tel quel, hors du périmètre.
  validations:
    required: false
