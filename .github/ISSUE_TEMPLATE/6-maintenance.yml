# Généré par hermes-software-factory (scripts/factory-github-templates.py) depuis config/types.yaml : ne pas éditer ici.
name: Maintenance
description: Refactor, dépendances, CI ou outillage, sans changement de comportement.
labels:
- type:maintenance
type: Task
body:
- type: markdown
  attributes:
    value: 'Modèle de la software factory (ADR 0017). Chaque section obligatoire est vérifiée à l''entrée : une issue incomplète
      reçoit le label « à cadrer » et ne part pas en fabrication. Numérote les critères C1, C2… : chacun se vérifie par un
      test, une mesure ou une capture.'
- type: textarea
  id: objectif
  attributes:
    label: Objectif
    description: Ce que la maintenance apporte.
  validations:
    required: true
- type: textarea
  id: perimetre
  attributes:
    label: Périmètre
    description: Les fichiers, dépendances ou workflows touchés.
  validations:
    required: true
- type: textarea
  id: invariant
  attributes:
    label: Invariant
    description: Ce qui ne doit pas changer. Par défaut, aucun test existant n'est modifié ni retiré.
  validations:
    required: true
- type: textarea
  id: criteres
  attributes:
    label: Critères d'acceptation
    description: 'Une ligne par critère, numérotée C1, C2… Chaque critère se vérifie par un test, une mesure ou une capture
      : « lisible » devient « un caractère au moins et les points de suspension visibles », « sur une ligne » devient « 20
      px de haut ».'
    placeholder: |-
      - C1 : …
      - C2 : …
  validations:
    required: true
- type: textarea
  id: ne_change_pas
  attributes:
    label: Ne change pas
    description: Ce qui doit rester tel quel, hors du périmètre.
  validations:
    required: false
