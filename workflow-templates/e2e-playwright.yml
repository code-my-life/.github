name: Bout en bout

# Tests de bout en bout d'une app web dans l'image officielle de Playwright, tirés de la CI de factory-live : Chromium
# et WebKit, mêmes navigateurs et mêmes polices que les captures de référence. Le rapport est joint en cas d'échec.
on:
  push:
    branches: [$default-branch]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Bout en bout (Chromium, WebKit)
    runs-on: ubuntu-24.04
    container:
      # Garder la version de l'image égale à celle de @playwright/test dans package-lock.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    env:
      CI: 'true'
      E2E_WEBKIT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npx playwright test
      - name: Rapport et traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
