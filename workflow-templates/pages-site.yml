name: Site

# Le site du projet, construit et testé à chaque pull request, publié sur GitHub Pages depuis la branche par défaut,
# tiré de factory-live. La publication est sautée tant que le dépôt est privé ; Pages doit avoir pour source GitHub
# Actions.
on:
  push:
    branches: [$default-branch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Site, build et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Construire le site
        run: npm run site:build
      - name: Tester le site
        run: npm run --if-present site:test
      - name: Préparer la publication
        if: github.ref == 'refs/heads/$default-branch' && github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Publication sur GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/$default-branch' && github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
