name: Image Docker

# L'image se construit, démarre et répond, tirée de la CI de factory-live : utilisateur 1000, racine en lecture seule,
# healthcheck sain. Adapter le Dockerfile, le port et la route de santé.
on:
  push:
    branches: [$default-branch]
  pull_request:

permissions:
  contents: read

env:
  PORT: '8080'
  HEALTH: /healthz

jobs:
  docker:
    name: Image Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f docker/Dockerfile -t app:ci .
      - name: Le conteneur démarre et répond, utilisateur 1000, racine en lecture seule, healthcheck sain
        run: |
          docker run -d --name app --read-only --tmpfs /tmp --user 1000:1000 --health-interval 2s --health-start-period 1s -p "127.0.0.1:$PORT:$PORT" app:ci
          ok=0; for i in $(seq 1 20); do curl -fsS "http://127.0.0.1:$PORT$HEALTH" && { ok=1; break; }; sleep 1; done
          if [ "$ok" != 1 ]; then docker logs app; exit 1; fi
          healthy=0; for i in $(seq 1 20); do [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && { healthy=1; break; }; sleep 1; done
          if [ "$healthy" != 1 ]; then docker inspect -f '{{json .State.Health}}' app; exit 1; fi
          test "$(docker inspect -f '{{.Config.User}}' app)" = "1000:1000"
          docker logs app | tail -5
