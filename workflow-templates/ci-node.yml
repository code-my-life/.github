name: CI

# Vérifications d'un projet Node, tirées de la CI de factory-live : format, lint, types, tests et build. Un script
# absent du package.json est sauté ; ajouter les versions de Node à couvrir dans la matrice.
on:
  push:
    branches: [$default-branch]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifications (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run --if-present format:check
      - run: npm run --if-present lint
      - run: npm run --if-present typecheck
      - run: npm run --if-present test
      - run: npm run --if-present build
