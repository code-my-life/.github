name: Release

# La release d'un tag vX.Y.Z, tirée de claude-cockpit : tests, contrôle que le tag est bien la version du package.json,
# build, puis la release GitHub avec ses notes générées. Joindre les fichiers produits par le build à « gh release ».
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Le tag est la version du package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run --if-present build
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Une relance trouve la release déjà publiée : elle n'en crée pas une seconde.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME déjà publiée"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
