name: E2E

# L'app Electron réelle sur un bureau Windows (Playwright _electron), tirée de la CI de claude-cockpit : les fenêtres,
# le focus et le premier plan ne se comportent vraiment que là. Une vidéo de tout le bureau est jointe au run.
on:
  push:
    branches: [$default-branch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # npm peut sauter les scripts d'installation : le binaire d'Electron est téléchargé explicitement.
      - run: node node_modules/electron/install.js
      # Matroska reste lisible si ffmpeg est tué ; une image clé par seconde, écrite sur disque au fil de l'eau.
      - name: Démarrer l'enregistrement de l'écran
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null; Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"; refreshenv | Out-Null }
          New-Item -ItemType Directory -Force desktop/test/screen | Out-Null
          $ffmpeg = Start-Process ffmpeg -PassThru -WindowStyle Hidden -ArgumentList '-y','-loglevel','error','-f','gdigrab','-framerate','10','-i','desktop','-t','900','-g','10','-cluster_time_limit','1000','-flush_packets','1','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','desktop/test/screen/desktop.mkv'
          "FFMPEG_PID=$($ffmpeg.Id)" >> $env:GITHUB_ENV
      - name: Tests E2E
        run: npm run test:e2e
      - name: Arrêter l'enregistrement
        if: always() && env.FFMPEG_PID != ''
        shell: pwsh
        working-directory: .
        run: Stop-Process -Id $env:FFMPEG_PID -ErrorAction SilentlyContinue
      - name: Vidéo, captures et traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            desktop/test/results/
            desktop/test/report/
            desktop/test/screen/
          if-no-files-found: warn
          retention-days: 14
